name: Validate community package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run validate
      - run: npm run build && npm test && npm run validate
        working-directory: experimental/service-hub
      - run: node --test test/*.test.mjs
        working-directory: addons/service-shelves
      - run: bash -n addons/service-shelves/install-oracle.sh
